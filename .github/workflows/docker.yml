name: "🐳 Docker Build and Push"

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

    # Publish `v1.2.3` tags as releases.
    tags:
      - v*

jobs:
  # PR gate: build the image (no publish) so a change that breaks the Dockerfile
  # (moved fonts, renamed assets, failing next build) is caught before merge.
  build-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64
          file: Dockerfile
          context: .
          push: false
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker images
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64
          file: Dockerfile
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Housekeeping: keep the 15 newest ghcr.io versions, never touch `latest`
      # or any human-readable version tag (`v1.2.3`, `1.2.3`, `1.2`) so releases
      # stay deployable/rollbackable.
      # Uses the REST API directly instead of actions/delete-package-versions,
      # which bundles an unmaintained os-name that crashes on recent macOS
      # runners (macosRelease() cannot map the Darwin version → build fails).
      # Best-effort: cleanup must never block a successful publish.
      - name: Delete old container versions
        uses: actions/github-script@v9
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const org = "deutscher-pfadfinderbund";
            const packageName = "anschriften";
            const keep = 15;

            const versions = await github.paginate(
              github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg,
              { org, package_type: "container", package_name: packageName, per_page: 100 },
            );

            versions.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            const semverTag = /^v?\d+\.\d+(\.\d+)?$/;
            const isProtected = (v) => {
              const tags = v.metadata?.container?.tags ?? [];
              return tags.includes("latest") || tags.some((t) => semverTag.test(t));
            };
            const deletable = versions.filter((v) => !isProtected(v));
            const toDelete = deletable.slice(keep);

            core.info(
              `total=${versions.length} protected=${versions.length - deletable.length} ` +
                `keeping=${Math.min(keep, deletable.length)} deleting=${toDelete.length}`,
            );

            for (const v of toDelete) {
              const tags = (v.metadata?.container?.tags ?? []).join(",") || "untagged";
              await github.rest.packages.deletePackageVersionForOrg({
                org,
                package_type: "container",
                package_name: packageName,
                package_version_id: v.id,
              });
              core.info(`deleted ${v.id} (${tags})`);
            }
