name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      # Migration-drift gate: fails if the committed migrations in drizzle/ are
      # inconsistent (e.g. a schema change merged without its generated migration).
      - name: Check migrations
        run: bunx drizzle-kit check

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
        env:
          # next build evaluates modules that read process.env at import time
          # (src/lib/auth.ts, src/db/index.ts). These are harmless dummies so the
          # build runs without real secrets — they never reach production.
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          BETTER_AUTH_SECRET: ci-dummy-secret-at-least-32-bytes-long
          BETTER_AUTH_URL: http://localhost:3000
          KEYCLOAK_ISSUER: http://localhost:8090/realms/ci
          KEYCLOAK_CLIENT_ID: anschriften
          KEYCLOAK_CLIENT_SECRET: ci-dummy
