services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: anschriften
      POSTGRES_PASSWORD: anschriften
      POSTGRES_DB: anschriften
    ports:
      - "5544:5432"
    volumes:
      - dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anschriften"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local Keycloak for developing/testing the login flow. Imports the dpb-dev
  # realm (client "anschriften", role "anschriften", test users kanzler/gast).
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8090:8080"
    volumes:
      - ./dev/keycloak:/opt/keycloak/data/import

  # Local SMTP sink for the optional mail module (issue #19). Catches every mail
  # so the send flow is end-to-end testable without a real provider.
  #   SMTP:   localhost:1025  (set SMTP_HOST=localhost, SMTP_PORT=1025, no auth)
  #   Web UI: http://localhost:8025  (also serves the JSON API at /api/v1/messages)
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  dev-db:
