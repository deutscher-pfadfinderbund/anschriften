# Produktion: App + Postgres + tägliches Backup. Der db-Service läuft nur im internen
# Netz (kein Traefik, kein Host-Port); App und Backup erreichen ihn unter `db`.
# DATABASE_URL in .env muss auf `db:5432` zeigen. Runbook: docs/deployment.md.
services:
  app:
    image: ghcr.io/deutscher-pfadfinderbund/anschriften:latest
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - traefik
      - internal
    labels:
      - "traefik.enable=true"
      # App hängt an zwei Netzen (traefik + internal). Ohne diese Zeile könnte
      # Traefik die interne IP wählen und intermittierend 504 liefern.
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.anschriften.rule=Host(`anschriften.deutscher-pfadfinderbund.de`)"
      - "traefik.http.routers.anschriften.entrypoints=websecure"
      - "traefik.http.routers.anschriften.tls.certresolver=letsencrypt"
      - "traefik.http.services.anschriften.loadbalancer.server.port=3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # Zum lokalen Testen ohne Traefik: die Blöcke networks/labels auskommentieren
    # und stattdessen den Port direkt freigeben:
    # ports:
    #   - "3000:3000"

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    # Nur POSTGRES_* statt env_file: .env — sonst lägen Auth-/SMTP-Secrets auch
    # im DB-Container. Compose lädt .env automatisch für die ${…}-Interpolation.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-anschriften}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss in .env gesetzt sein}
      POSTGRES_DB: ${POSTGRES_DB:-anschriften}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      # `-h 127.0.0.1` erzwingt eine TCP-Verbindung. Ohne den Host prüft pg_isready
      # den lokalen Unix-Socket, den initdb schon während der ersten Initialisierung
      # kurz öffnet — der Healthcheck würde „healthy" melden, bevor die DB wirklich
      # bereit ist, und die App startet gegen einen noch nicht fertigen Server.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-anschriften}"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Tägliches pg_dump ins Host-Verzeichnis ./backups. Retention 14 tägliche /
  # 8 wöchentliche Dumps. Läuft im internen Netz, greift wie die App über den
  # Hostnamen `db` zu. Restore-Prozedur: siehe docs/deployment.md.
  backup:
    image: prodrigestivill/postgres-backup-local:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-anschriften}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss in .env gesetzt sein}
      POSTGRES_DB: ${POSTGRES_DB:-anschriften}
      SCHEDULE: ${BACKUP_SCHEDULE:-@daily}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-8}
      BACKUP_KEEP_MONTHS: 0
    volumes:
      - ./backups:/backups
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

# Extern angelegtes Traefik-Netz des Servers (`docker network create traefik`,
# bzw. der Name, den der Traefik-Stack dort tatsächlich nutzt). `internal` ist
# ein privates Netz nur zwischen App und db.
networks:
  traefik:
    external: true
  internal:

volumes:
  db-data:
